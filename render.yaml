services:
  - type: web
    name: ddiba-learn
    runtime: python
    plan: free
    healthCheckPath: /api/health/
    rootDir: Backend/ddiba_learn
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --no-input
    startCommand: gunicorn ddiba_learn.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ddiba-learn.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ddiba.onrender.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ddiba
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ddiba-learn.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
